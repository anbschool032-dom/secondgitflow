<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration Form</title>
    <!-- Load Tailwind CSS from CDN for modern, utility-first styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Optional: Custom font for a modern look */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom CSS for input focus to provide clear feedback */
        .form-input-focus:focus {
            outline: none;
            border-color: #4f46e5; /* Indigo-600 */
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); /* Indigo ring */
        }

        /* Message Box Styles (retained from custom CSS for feedback) */
        #messageBox.hidden { display: none; }
        #messageBox.success { background-color: #d1fae5; color: #065f46; }
        #messageBox.error { background-color: #fee2e2; color: #991b1b; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-gray-50">

    <!-- Registration Card Container (max width 480px, centered on the screen) -->
    <div class="w-full max-w-lg bg-white p-8 md:p-10 rounded-3xl shadow-2xl border border-gray-100 transition duration-300 hover:shadow-3xl">
        
        <!-- Header Section -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-extrabold text-gray-900 mb-2">
                <span class="text-indigo-600">Start</span> Your Free Trial
            </h1>
            <p class="text-base text-gray-500">
                Create your account in seconds.
            </p>
        </header>

        <!-- Registration Form -->
        <form onsubmit="event.preventDefault(); showMessage('Registration simulated successfully!', false);">
            
            <!-- Full Name Field -->
            <div class="mb-5">
                <label for="fullName" class="block text-sm font-semibold text-gray-700 mb-2">
                    Full Name
                </label>
                <input 
                    type="text" 
                    id="fullName" 
                    name="fullName" 
                    placeholder="John Doe"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl transition duration-150 form-input-focus"
                >
            </div>

            <!-- Email Address Field -->
            <div class="mb-5">
                <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">
                    Email Address
                </label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="you@example.com"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl transition duration-150 form-input-focus"
                >
            </div>

            <!-- Password Field -->
            <div class="mb-5">
                <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">
                    Password
                </label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="••••••••"
                    required
                    minlength="8"
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl transition duration-150 form-input-focus"
                >
            </div>

            <!-- Confirm Password Field -->
            <div class="mb-6">
                <label for="confirmPassword" class="block text-sm font-semibold text-gray-700 mb-2">
                    Confirm Password
                </label>
                <input 
                    type="password" 
                    id="confirmPassword" 
                    name="confirmPassword" 
                    placeholder="••••••••"
                    required
                    minlength="8"
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl transition duration-150 form-input-focus"
                >
            </div>

            <!-- Terms & Conditions Checkbox -->
            <div class="mb-8 flex items-center">
                <input 
                    type="checkbox" 
                    id="terms" 
                    name="terms" 
                    required
                    class="h-5 w-5 text-indigo-600 border-gray-300 rounded-lg focus:ring-indigo-500"
                >
                <label for="terms" class="ml-3 text-sm text-gray-600 select-none">
                    I agree to the 
                    <a href="#" class="text-indigo-600 hover:text-indigo-700 font-bold transition duration-150">Terms and Conditions</a>
                </label>
            </div>

            <!-- Submit Button -->
            <button 
                type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-3 rounded-xl shadow-lg transition duration-200 transform hover:scale-[1.01] focus:outline-none focus:ring-4 focus:ring-indigo-300"
            >
                Register Now
            </button>
        </form>
        
        <!-- Message Box -->
        <div id="messageBox" class="message-box hidden p-4 mt-6 rounded-lg text-center font-semibold"></div>

        <!-- Footer Link -->
        <p class="mt-8 text-center text-sm text-gray-500">
            Already registered? 
            <a href="#" class="text-indigo-600 hover:text-indigo-700 font-bold">Log in here</a>
        </p>
    </div>

    <!-- Simple JavaScript for message simulation -->
    <script>
        function showMessage(text, isError) {
            const msgBox = document.getElementById('messageBox');
            msgBox.textContent = text;
            msgBox.classList.remove('hidden', 'success', 'error');
            msgBox.classList.add(isError ? 'error' : 'success');
            
            // Hide message after 4 seconds
            setTimeout(() => {
                msgBox.classList.add('hidden');
            }, 4000);
        }
    </script>
</body>
</html>
